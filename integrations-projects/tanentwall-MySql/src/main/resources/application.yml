server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/store_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
      show-sql: true
      session_factory:
          statement_inspector: com.storemysql.config.TenantWallStatementInspector
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        query:
          plan_cache_max_size : 64
    open-in-view: false
  sql:
    init:
      mode: always
      continue-on-error: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.store: INFO