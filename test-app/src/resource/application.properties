# اسم التطبيق
spring.application.name=DataShield-TestApp

# إعدادات H2 (تشتغل في الذاكرة)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA: يشتغل ويخلق الجداول أوتوماتيكياً
spring.jpa.hibernate.ddl-auto=create-drop

# عشان نشوف الـ SQL اللي Hibernate بيعملها في الكونسول (هتقارنها باعتراض الـ Agent)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# عشان نشوف الـ H2 Console في المتصفح (اختياري لكن مفيد)
spring.h2.console.enabled=true
spring.h2.console.path=/H2

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.display-request-duration=true