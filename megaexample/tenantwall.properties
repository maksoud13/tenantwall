# ═══════════════════════════════════════════════════════════════
#  TenantWall Agent Configuration
# ═══════════════════════════════════════════════════════════════

# ═══ Core ═══
tenantwall.enabled=true
tenantwall.filter.column=tenant_id

# [WARN] For load test: use "skip" so startup/seed don't crash
# Switch to "fail" only AFTER you verify all paths have tenant context
tenantwall.filter.onMissing=skip

# ═══ [HOT] CRITICAL: Excluded lookup tables (no tenant_id) ═══
# These 7 tables have NO tenant_id column → MUST be excluded
tenantwall.filter.excludedTables=countries,currencies,payment_methods,shipping_carriers,product_attributes,roles,permissions,flyway_schema_history

# ═══ Parser ═══
# Python parser handles complex SQL (CTEs, window functions)
# If it's down → falls back to local JSqlParser
tenantwall.parser.url=http://localhost:8000
tenantwall.parser.dialect=mysql

# ═══ INSERT strategy ═══
# skip = don't inject for INSERT without column list (safest)
# append = inject as last column (only if tenant_id is last)
# fail = throw exception
tenantwall.insert.strategy=skip



# ═══ Tenant Resolution (NEW — Zero Code Setup) ═══
tenantwall.tenant.strategy=header
tenantwall.tenant.headerName=X-Tenant-Id
