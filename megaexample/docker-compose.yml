version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mega-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mega_demo
    ports:
      - "3306:3306"
    volumes:
      - mega-mysql-data:/var/lib/mysql
    command:
      - --innodb-buffer-pool-size=2G
      - --innodb-log-file-size=512M
      - --innodb-flush-log-at-trx-commit=2
      - --max-connections=300
      - --innodb-io-capacity=2000
      - --innodb-flush-method=O_DIRECT
      - --skip-name-resolve
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: '3'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

volumes:
  mega-mysql-data:
