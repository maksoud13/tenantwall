version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mega-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mega_demo
    ports:
      - "3306:3306"
    volumes:
      - mega-mysql-data:/var/lib/mysql
    command:
      - --innodb-buffer-pool-size=3G      # was 2G — better for 25M rows
      - --innodb-log-file-size=1G         # was 512M
      - --innodb-flush-log-at-trx-commit=2
      - --max-connections=300
      - --innodb-io-capacity=4000          # was 2000 — faster seed
      - --innodb-flush-method=O_DIRECT
      - --skip-name-resolve
      - --innodb-buffer-pool-instances=4   # parallelize buffer
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: '4'          # was 3 — more for seed
          memory: 6G         # was 4G — buffer 3G + overhead
        reservations:
          cpus: '2'
          memory: 3G

volumes:
  mega-mysql-data: