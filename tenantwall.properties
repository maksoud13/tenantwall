tenantwall.enabled=true
tenantwall.filter.column=tenant_id
tenantwall.filter.onMissing=skip
tenantwall.parser.url=http://127.0.0.1:8000
tenantwall.parser.dialect=mysql
tenantwall.filter.excludedTables=audit_log,tenants
# ═══ Parser Security (JWT agent↔parser) — NEW ═══
# HMAC-SHA256 token for agent→parser auth.
# Set a strong secret (32+ chars) on BOTH sides:
#   Java:   tenantwall.parser.secret=...
#   Python: TENANTWALL_PARSER_SECRET=...
#
# enforceAuth=false (default) → backward compatible, no auth required.
# enforceAuth=true            → reject unsigned requests (production).
tenantwall.parser.enforceAuth=false
# tenantwall.parser.secret=CHANGE_ME_32_CHARS_MINIMUM_RANDOM_STRING
# tenantwall.parser.token.ttlSeconds=60